<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#041225"><title>FC 27 Manager • Napoli Edition</title><style>
:root{--bg:#061426;--panel:#0c2039;--edge:#214b73;--blue:#058eff;--lime:#b8ff43;--muted:#a9c0d9;--white:#f6fbff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#123c65 0,#07172c 42%,#040c19 100%);color:var(--white);font:15px system-ui,-apple-system,Arial;min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}header{background:linear-gradient(110deg,#06182d,#0c3c69 75%,#06152a);padding:27px 18px 20px;border-bottom:2px solid var(--blue);position:relative;overflow:hidden}header:after{content:'27';position:absolute;right:-14px;top:-55px;font-size:180px;font-weight:1000;opacity:.06;pointer-events:none}header h1{margin:0;font-size:clamp(26px,7vw,40px);font-style:italic;letter-spacing:-1.5px;font-weight:1000}header h1 em{color:var(--lime);font-style:italic}header small{letter-spacing:3px;color:#c5d8ed;font-size:11px}.topline{display:flex;justify-content:space-between;align-items:center;gap:8px}.crest{width:52px;height:52px;display:grid;place-items:center;background:linear-gradient(#168bfa,#02478b);border:2px solid #86d9ff;border-radius:50%;font:38px Georgia;box-shadow:0 0 20px #007bff66;flex-shrink:0}.headtext{flex:1}.season{font-size:10px;text-align:right;color:#b6cce4}.nav{display:flex;gap:8px;overflow:auto;padding:12px 12px;background:#07172b;scrollbar-width:none;position:sticky;top:0;z-index:5}.nav button,.bottom button{border:1px solid #23435f;color:#d6e5f5;background:linear-gradient(#112941,#08172a);border-radius:12px;padding:12px 14px;font-weight:850;font-size:12px;white-space:nowrap}.nav button.active,.bottom button.active{background:linear-gradient(#1eb7ff,#0068ed);border-color:#37c8ff;box-shadow:0 0 16px #007bff88;color:white}.nav button.active{background:var(--lime);color:#0b1820;border-color:var(--lime)}main{max-width:950px;margin:auto;padding:15px 12px 115px}.panel{background:linear-gradient(140deg,#102a47ee,#081a30f5);border:1px solid #1c5686;border-radius:18px;padding:17px;margin-bottom:13px;box-shadow:inset 0 1px #ffffff0b,0 8px 24px #0003}.panel h2{margin:0 0 14px;font-size:15px;letter-spacing:.6px;text-transform:uppercase}.panel h2 .arrow{float:right;color:#3abaff}.eyebrow{font-size:11px;letter-spacing:1.3px;color:#c6e4fc;font-weight:800}.muted{color:var(--muted)}.match{display:grid;grid-template-columns:1fr 1.1fr 1fr;align-items:center;text-align:center;gap:5px;margin:15px 0}.team{font-size:12px;font-weight:900}.teamicon{height:60px;width:60px;border-radius:50%;background:#075fbd;border:2px solid #53bcff;display:grid;place-items:center;margin:0 auto 8px;font:42px Georgia;box-shadow:0 0 15px #007fff55}.othericon{font-size:53px;font-weight:1000;line-height:65px}.matchmid{font-size:13px;color:#bcd4ed}.matchmid strong{font-size:21px;color:white}.primary{width:100%;border:0;border-radius:11px;padding:14px;background:linear-gradient(120deg,#12baff,#0066ec);color:white;font-weight:900;box-shadow:0 4px 14px #006fff66}.lime{background:var(--lime);color:#09192b;box-shadow:none}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:12px}.table{width:100%;border-collapse:collapse;font-size:12px}.table td,.table th{padding:8px 4px;text-align:left;border-bottom:1px solid #25415a}.table tr.highlight{background:#084f92;color:white}.result{display:flex;justify-content:space-between;gap:5px;padding:10px 2px;border-bottom:1px solid #24425d;font-size:12px}.pill{background:#007c6d;color:#d5fff3;padding:2px 7px;border-radius:6px}.loss{background:#b62548}.draw{background:#536a85}.bar{height:8px;background:#183b58;border-radius:8px;overflow:hidden;margin:8px 0 13px}.bar i{height:100%;display:block;background:linear-gradient(90deg,#0067f8,#13d3ef);border-radius:8px}.cards{display:flex;gap:9px;overflow-x:auto;padding-bottom:5px}.playercard{min-width:115px;min-height:164px;background:linear-gradient(145deg,#554019,#111927 40%,#07121f 80%);border:2px solid #d8b85c;border-radius:19px 19px 25px 25px;padding:10px 6px;text-align:center;box-shadow:inset 0 0 15px #d2b64c2c}.playercard b{display:block;font-size:25px;color:#f8d35b}.playercard .person{font-size:38px;line-height:51px}.playercard strong{display:block;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.playercard small{font-size:10px;color:#c8d8ea}.bottom{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;gap:5px;padding:8px 7px calc(8px + env(safe-area-inset-bottom));background:#051327ed;backdrop-filter:blur(14px);border-top:1px solid #22507c;z-index:10}.bottom button{flex:1;padding:8px 2px;font-size:10px}.bottom span{display:block;font-size:20px;margin-bottom:3px}.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;min-width:0}.field label{font-size:11px;font-weight:800;color:#c5dbf1;letter-spacing:.4px}.field input,.field select,.field textarea{width:100%;background:#061524;color:#fff;border:1px solid #42607d;border-radius:9px;padding:12px;outline-color:#00aaff}.fields{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}.item{border:1px solid #2b4b69;background:#091b30;border-radius:12px;padding:13px;margin:8px 0}.item strong{font-size:15px}.item p{font-size:12px;color:#b5cce2;margin:6px 0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}.actions button,.secondary{border:1px solid #356083;background:#173451;color:#e6f5ff;border-radius:9px;padding:8px 11px;font-weight:700}.danger{color:#ff9fa9!important}.pitch{border:3px solid #c4ebff80;border-radius:12px;min-height:420px;background:repeating-linear-gradient(0deg,#116148 0 52px,#146d50 52px 104px);position:relative;padding:18px 8px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}.pitch:before{content:'';position:absolute;inset:45% 0 auto;border-top:2px solid #ffffff77}.pitch:after{content:'';position:absolute;width:110px;height:110px;border:2px solid #ffffff66;border-radius:50%;top:50%;left:50%;transform:translate(-50%,-50%)}.pitchrow{display:flex;justify-content:space-around;position:relative;z-index:1;gap:3px}.slot{width:24%;max-width:100px;text-align:center;background:#051c31d9;border:1px solid #83c5f0;border-radius:10px;padding:7px 2px;font-size:10px;min-height:57px;display:grid;place-items:center}.slot b{color:var(--lime);font-size:12px}.notice{padding:10px;border-left:3px solid var(--lime);background:#153048;border-radius:6px;font-size:12px;color:#d2e5f5;margin-bottom:14px}.hide{display:none!important}@media(max-width:650px){.twocol{grid-template-columns:1fr}.season{display:none}.panel{padding:14px}.match{gap:2px}.fields{grid-template-columns:1fr 1fr}}@media(min-width:651px){.twocol>.panel{margin-bottom:0}} </style></head><body>
<header><div class="topline"><div class="crest">N</div><div class="headtext"><h1>FC 27 <em>MANAGER</em></h1><small>NAPOLI EDITION / CAREER HUB</small></div><div class="season">STAGIONE 2026/27<br>Carriera Allenatore</div></div></header><nav class="nav" id="nav"></nav><main id="app"></main><div class="bottom" id="bottom"></div>
<script>
const KEY='fc27-manager-napoli-v3',OLD='fc27-napoli-v1';const sampleNames=['Højlund','De Bruyne','Lobotka','McTominay','Nusa','Rrahmani','Mukiele','Vergara','Santos','Milinković-Savić','Lang'];const samples=sampleNames.map((name,i)=>({id:'sample'+i,name,role:['ATT','CC','CC','CC','AS','DC','TD','CC','CC','POR','AS'][i],ovr:'',contract:'',status:'Disponibile',goals:0,assists:0,apps:0,group:'Rosa',example:true}));const base={players:samples,market:[],academy:[],matches:[],objectives:[],lineup:[],formation:'4-3-3',budget:'',next:{opponent:'Da impostare',date:'',competition:'Serie A',home:true},table:[],note:''};function safeJSON(s){try{return JSON.parse(s)}catch{return null}}let existing=safeJSON(localStorage.getItem(KEY));let legacy=safeJSON(localStorage.getItem(OLD));let state=existing||structuredClone(base);if(!existing&&legacy){let list=Array.isArray(legacy)?legacy:legacy.players||legacy.rosa;if(Array.isArray(list)&&list.length){state.players=list.map((p,i)=>({id:p.id||'old'+i,name:p.name||p.nome||'Giocatore',role:p.role||p.ruolo||'',ovr:p.ovr||p.overall||'',contract:p.contract||p.contratto||'',status:p.status||'Disponibile',goals:p.goals||p.gol||0,assists:p.assists||0,apps:p.apps||p.presenze||0,group:p.group||'Rosa',example:!!p.example}));}for(const k of ['market','academy','matches','lineup','formation','budget'])if(legacy[k]!==undefined)state[k]=legacy[k];}const save=()=>localStorage.setItem(KEY,JSON.stringify(state));save();let tab='Home';const tabs=[['Home','⌂'],['Rosa','♟'],['Formazione','▣'],['Mercato','⇄'],['Calendario','▦'],['Vivaio','♧'],['Obiettivi','★'],['Impostazioni','⚙']];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const v=(id)=>document.getElementById(id)?.value||'';function changeTab(t){tab=t;render();window.scrollTo(0,0)}function menu(){document.getElementById('nav').innerHTML=tabs.map(([t,ic])=>`<button class="${tab===t?'active':''}" onclick="changeTab('${t}')">${ic} ${t.toUpperCase()}</button>`).join('');document.getElementById('bottom').innerHTML=tabs.slice(1,5).concat([tabs[0]]).map(([t,ic])=>`<button class="${tab===t?'active':''}" onclick="changeTab('${t}')"><span>${ic}</span>${t}</button>`).join('')};const panel=(title,html)=>`<section class="panel"><h2>${title}</h2>${html}</section>`;const field=(name,id,type='text',value='',options=null)=>`<div class="field"><label>${name}</label>${options?`<select id="${id}">${options.map(o=>`<option ${String(o)===String(value)?'selected':''}>${esc(o)}</option>`).join('')}</select>`:`<input id="${id}" type="${type}" value="${esc(value)}">`}</div>`;function home(){const next=state.next;const recent=[...state.matches].slice(-4).reverse();const ranked=[...state.players].filter(p=>!p.example).sort((a,b)=>Number(b.ovr||0)-Number(a.ovr||0)).slice(0,5);const featured=ranked.length?ranked:state.players.slice(0,5);return panel('PROSSIMA PARTITA <span class="arrow">'+esc(next.competition)+'</span>',`<div class="match"><div><div class="teamicon">N</div><div class="team">NAPOLI</div></div><div class="matchmid">${esc(next.date||'Data da inserire')}<br><strong>VS</strong><br>${next.home?'Casa':'Trasferta'}</div><div><div class="othericon">⚽</div><div class="team">${esc(next.opponent)}</div></div></div><button class="primary" onclick="changeTab('Calendario')">GESTISCI LA PARTITA ❯</button>`)+`<div class="twocol">`+panel('CLASSIFICA / POSIZIONI',state.table.length?`<table class="table"><tr><th>#</th><th>Squadra</th><th>Pt</th></tr>${state.table.map((x,i)=>`<tr class="${x.team?.toLowerCase()==='napoli'?'highlight':''}"><td>${i+1}</td><td>${esc(x.team)}</td><td>${esc(x.points)}</td></tr>`).join('')}</table>`:`<p class="muted">Inserisci la classifica della tua carriera.</p><button class="secondary" onclick="changeTab('Impostazioni')">Imposta classifica</button>`)+panel('ULTIME PARTITE',recent.length?recent.map(m=>`<div class="result"><span>${esc(m.opponent)}</span><b>${esc(m.for)} – ${esc(m.against)}</b><span class="pill ${Number(m.for)<Number(m.against)?'loss':Number(m.for)===Number(m.against)?'draw':''}">${Number(m.for)>Number(m.against)?'V':Number(m.for)<Number(m.against)?'P':'N'}</span></div>`).join(''):'<p class="muted">Nessun risultato ancora registrato.</p>')+panel('NOTIZIE DEL CLUB',`<p class="muted">${esc(state.note||'Il tuo Napoli è pronto: aggiorna qui le notizie della carriera.')}</p>`)+panel('OBIETTIVI STAGIONALI',state.objectives.length?state.objectives.slice(0,4).map(o=>`<div style="font-size:12px">${esc(o.name)} <span style="float:right">${Number(o.progress)||0}%</span></div><div class="bar"><i style="width:${Math.max(0,Math.min(100,Number(o.progress)||0))}%"></i></div>`).join(''):'<p class="muted">Aggiungi i tuoi obiettivi stagionali.</p>')+`</div>`+panel('GIOCATORI CHIAVE <span class="arrow">❯</span>',`<div class="cards">${featured.map(p=>`<div class="playercard"><b>${esc(p.ovr||'—')}</b><small>${esc(p.role||'—')}</small><div class="person">♟</div><strong>${esc(p.name).toUpperCase()}</strong><small>${Number(p.goals)||0} G · ${Number(p.assists)||0} A</small></div>`).join('')}</div><p class="muted" style="font-size:11px">${ranked.length?'Valori inseriti da te.':'Giocatori dimostrativi: overall e statistiche da inserire.'}</p>`)}
function playerForm(p={}){return `<div class="fields">${field('NOME','pname','text',p.name)}${field('RUOLO','prole','text',p.role)}${field('OVERALL','povr','number',p.ovr)}${field('CONTRATTO FINO AL','pcontract','number',p.contract)}${field('PRESENZE','papps','number',p.apps??0)}${field('GOL','pgoals','number',p.goals??0)}${field('ASSIST','passists','number',p.assists??0)}${field('STATO','pstatus','text',p.status||'Disponibile')}${field('GRUPPO','pgroup','text',p.group||'Rosa')}</div><button class="primary lime" onclick="storePlayer('${p.id||''}')">${p.id?'SALVA MODIFICHE':'AGGIUNGI GIOCATORE'}</button>`};let editing=null;function storePlayer(id){const name=v('pname').trim();if(!name)return alert('Inserisci il nome');const old=state.players.find(p=>p.id===id);const p={...old,id:id||String(Date.now()),name,role:v('prole'),ovr:v('povr'),contract:v('pcontract'),apps:Number(v('papps')),goals:Number(v('pgoals')),assists:Number(v('passists')),status:v('pstatus'),group:v('pgroup'),example:false};if(old)state.players=state.players.map(x=>x.id===id?p:x);else state.players.push(p);editing=null;save();render()}function editPlayer(id){editing=id;render();window.scrollTo(0,0)}function deletePlayer(id){if(confirm('Eliminare questo giocatore?')){state.players=state.players.filter(p=>p.id!==id);state.lineup=state.lineup.filter(x=>x!==id);save();render()}}function rosa(){const p=state.players.find(x=>x.id===editing);return panel('LA MIA ROSA ('+state.players.length+')',`<div class="notice">I giocatori con etichetta ESEMPIO sono dimostrativi. Inserisci i dati reali della tua carriera.</div>${playerForm(p||{})}${editing?'<button class="secondary" onclick="editing=null;render()" style="margin-top:10px">Annulla modifica</button>':''}`)+state.players.map(p=>`<div class="item"><strong>${esc(p.name)} ${p.example?'<span style="color:#f5d879;font-size:10px">ESEMPIO</span>':''}</strong><p>${esc(p.role)} · OVR ${esc(p.ovr||'—')} · Contratto ${esc(p.contract||'—')} · ${esc(p.group)}</p><p>${esc(p.status)} · ${p.apps||0} presenze · ${p.goals||0} gol · ${p.assists||0} assist</p><div class="actions"><button onclick="editPlayer('${p.id}')">Modifica</button><button class="danger" onclick="deletePlayer('${p.id}')">Elimina</button></div></div>`).join('')}
function formazione(){const groups=state.formation==='4-4-2'?[2,4,4,1]:state.formation==='3-5-2'?[2,5,3,1]:[3,3,4,1];let pos=0;const pitch=groups.map(n=>`<div class="pitchrow">${Array.from({length:n},()=>{const index=pos++;const id=state.lineup[index];const p=state.players.find(x=>x.id===id);return `<div class="slot"><b>${esc(p?.ovr||'—')}</b><span>${esc(p?.name||'Vuoto')}</span></div>`}).join('')}</div>`).join('');return panel('FORMAZIONE TITOLARE',`<div class="field"><label>MODULO</label><select id="mod" onchange="state.formation=this.value;save();render()">${['4-3-3','4-4-2','3-5-2'].map(x=>`<option ${state.formation===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="pitch">${pitch}</div><p class="muted">Scegli i titolari nell'ordine: attacco, centrocampo, difesa, portiere.</p>${Array.from({length:11},(_,i)=>`<div class="field"><label>TITOLARE ${i+1}</label><select onchange="state.lineup[${i}]=this.value;save();render()"><option value="">— Scegli —</option>${state.players.map(p=>`<option value="${esc(p.id)}" ${state.lineup[i]===p.id?'selected':''}>${esc(p.name)} (${esc(p.role)})</option>`).join('')}</select></div>`).join('')}`)+panel('PANCHINA E RISERVE',state.players.filter(p=>!state.lineup.includes(p.id)).map(p=>`<div class="result">${esc(p.name)} <span>${esc(p.role)} · ${esc(p.status)}</span></div>`).join('')||'<p class="muted">Nessuna riserva.</p>')}
function collection(which,title,labels){const arr=state[which];return panel(title,`<div class="fields">${labels.map(([label,id])=>field(label,id)).join('')}</div><button class="primary lime" onclick="addCollection('${which}')">+ AGGIUNGI</button>`)+arr.map((o,i)=>`<div class="item"><strong>${esc(o.name)}</strong><p>${Object.entries(o).filter(([k])=>k!=='name').map(([k,val])=>esc(val)).join(' · ')}</p><button class="secondary danger" onclick="removeCollection('${which}',${i})">Elimina</button></div>`).join('')};function addCollection(which){const ids={market:['mname','mtype','mstatus','mprice'],academy:['aname','arole','aovr','acountry'],objectives:['oname','oprogress']}[which];let obj={name:v(ids[0]).trim()};if(!obj.name)return alert('Inserisci un nome');ids.slice(1).forEach((id,i)=>obj[['type','status','price'][i]&&which==='market'?['type','status','price'][i]:which==='academy'?['role','ovr','country'][i]:['progress'][i]]=v(id));state[which].push(obj);save();render()}function removeCollection(which,i){if(confirm('Eliminare questa voce?')){state[which].splice(i,1);save();render()}}function calendario(){return panel('PROSSIMA PARTITA',`${field('AVVERSARIO','nextopp','text',state.next.opponent)}${field('DATA E ORA','nextdate','datetime-local',state.next.date)}${field('COMPETIZIONE','nextcomp','text',state.next.competition)}${field('CASA / TRASFERTA','nexthome','text',state.next.home?'Casa':'Trasferta')}<button class="primary" onclick="state.next={opponent:v('nextopp'),date:v('nextdate'),competition:v('nextcomp'),home:v('nexthome').toLowerCase()!=='trasferta'};save();render()">SALVA PROSSIMA PARTITA</button>`)+panel('REGISTRA RISULTATO',`<div class="fields">${field('AVVERSARIO','opp')}${field('GOL NAPOLI','gf','number')}${field('GOL AVVERSARIO','ga','number')}${field('DATA','date','date')}</div><button class="primary lime" onclick="addMatch()">+ SALVA PARTITA</button>`)+panel('STORICO PARTITE',state.matches.map((m,i)=>`<div class="item"><strong>Napoli ${esc(m.for)} - ${esc(m.against)} ${esc(m.opponent)}</strong><p>${esc(m.date)}</p><button class="secondary danger" onclick="state.matches.splice(${i},1);save();render()">Elimina</button></div>`).join('')||'<p class="muted">Nessuna partita registrata.</p>')};function addMatch(){if(!v('opp'))return alert('Inserisci avversario');state.matches.push({opponent:v('opp'),for:v('gf'),against:v('ga'),date:v('date')});save();render()}
function settings(){return panel('SALVATAGGIO E SICUREZZA',`<div class="notice">I dati vengono salvati su questo iPhone nel browser (localStorage), non su GitHub. Non cancellare i dati dei siti. Prima di sostituire la versione precedente esporta anche un backup da quella versione, se possibile.</div><button class="primary" onclick="exportData()">⬇ ESPORTA BACKUP JSON</button><p class="muted">Per importare un backup compatibile:</p><input type="file" id="importfile" accept=".json,application/json" onchange="importData(event)"><hr style="border-color:#2b4d68;margin:20px 0">${field('BUDGET MERCATO (€)','budget','number',state.budget)}${field('NOTIZIE DEL CLUB','clubnote','text',state.note)}<button class="primary lime" onclick="state.budget=v('budget');state.note=v('clubnote');save();render()">SALVA INFORMAZIONI</button><p class="muted">Budget attuale: € ${esc(state.budget||'da inserire')}</p>`)+panel('CLASSIFICA MANUALE',`${field('SQUADRA','team')}${field('PUNTI','points','number')}<button class="primary" onclick="if(v('team')){state.table.push({team:v('team'),points:v('points')});state.table.sort((a,b)=>Number(b.points)-Number(a.points));save();render()}">AGGIUNGI SQUADRA</button>${state.table.map((x,i)=>`<div class="result">${esc(x.team)} — ${esc(x.points)} pt <button class="secondary danger" onclick="state.table.splice(${i},1);save();render()">×</button></div>`).join('')}`)}function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='fc27-napoli-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const d=safeJSON(r.result);if(!d||!Array.isArray(d.players))return alert('Backup non valido');if(confirm('Importare questo backup? Sostituirà i dati della versione 3.')){state={...structuredClone(base),...d};save();render()}};r.readAsText(f)}function render(){menu();document.getElementById('app').innerHTML=tab==='Home'?home():tab==='Rosa'?rosa():tab==='Formazione'?formazione():tab==='Mercato'?collection('market','MERCATO E OBIETTIVI', [['GIOCATORE','mname'],['TIPO (acquisto / vendita / prestito)','mtype'],['STATO TRATTATIVA','mstatus'],['COSTO / VALORE','mprice']]):tab==='Vivaio'?collection('academy','VIVAIO E OSSERVATORI', [['GIOCATORE','aname'],['RUOLO','arole'],['OVERALL / POTENZIALE','aovr'],['PAESE DI RICERCA','acountry']]):tab==='Obiettivi'?collection('objectives','OBIETTIVI STAGIONALI', [['OBIETTIVO','oname'],['PROGRESSO %','oprogress']]):tab==='Calendario'?calendario():settings()}render();
</script></body></html>
