<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#087bc1"><title>FC 27 Manager Napoli</title><meta name="theme-color" content="#101a2a"><style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f5f7fb;background:#080e19;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 0%,#19345b 0%,transparent 35%),#080e19;min-height:100vh}header{padding:calc(30px + env(safe-area-inset-top)) 20px 24px;background:linear-gradient(125deg,#0b2038,#123e61 60%,#0d1a2a);border-bottom:2px solid #b5fa36;position:relative;overflow:hidden}header:after{content:'27';position:absolute;right:5px;top:8px;font-size:115px;font-weight:1000;font-style:italic;color:#ffffff0b;pointer-events:none}header h1{margin:0;font-size:30px;letter-spacing:-1.4px;font-weight:900;text-transform:uppercase;font-style:italic}header p{margin:8px 0 0;color:#b9cddd;font-size:13px;letter-spacing:1px;text-transform:uppercase}nav{display:flex;overflow-x:auto;gap:5px;padding:13px 12px;background:#101a2a;border-bottom:1px solid #263b4c;position:sticky;top:0;z-index:5;scrollbar-width:none}nav::-webkit-scrollbar{display:none}nav button{flex:none;background:#1c2b3d;border:1px solid #314457;border-radius:8px;color:#c6d5e1;font-weight:800;padding:11px 14px;font-size:12px;text-transform:uppercase;letter-spacing:.5px}nav button.active{background:#c3ff45;color:#111c20;border-color:#c3ff45;box-shadow:0 0 18px #b5fa3633}main{max-width:950px;margin:auto;padding:18px 13px 35px}.panel{background:linear-gradient(150deg,#17273b,#101b2b);border:1px solid #2b4053;border-radius:15px;padding:19px;margin:0 0 13px;box-shadow:0 8px 25px #0003}.panel h2{margin:0 0 15px;text-transform:uppercase;letter-spacing:.4px;font-size:20px;font-style:italic}.panel h3{font-size:15px;text-transform:uppercase}.panel strong{font-size:19px}.muted{color:#aabed0;font-size:14px;line-height:1.6}.notice{color:#b1c3d0;font-size:13px;line-height:1.5}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}form{display:grid;gap:13px;margin-top:18px}label{display:grid;gap:6px;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:#cbdbe8;font-weight:800}input,select,textarea{display:block;width:100%;border:1px solid #40556b;border-radius:9px;background:#091523;color:#f6fbff;font:inherit;font-size:16px;padding:13px;min-height:45px;outline:none}input:focus,select:focus{border-color:#c3ff45;box-shadow:0 0 0 2px #c3ff4522}button{cursor:pointer;font:inherit}button.primary{background:#c3ff45;color:#0b171c;border:0;border-radius:9px;padding:13px 16px;font-weight:900;text-transform:uppercase;letter-spacing:.3px}button.secondary{background:#23394d;color:#eaf4ff;border:1px solid #3b5367;border-radius:8px;padding:10px 14px;font-weight:700}button.danger{color:#ff8d93}.tag{font-size:10px;border:1px solid #7cae5b;color:#c3ff45;border-radius:4px;padding:4px 7px;font-weight:900;text-transform:uppercase;letter-spacing:.6px}.tag.demo{color:#fbd98a;border-color:#81693a;background:#463a2044}.pitch{margin-top:18px;border:2px solid #ffffff75;border-radius:5px;padding:22px 8px;min-height:420px;display:flex;flex-direction:column;justify-content:space-between;background:repeating-linear-gradient(0deg,#195b46 0px,#195b46 55px,#1b6c50 55px,#1b6c50 110px);position:relative;overflow:hidden}.pitch:before{content:'';position:absolute;inset:49% 0 auto;border-top:2px solid #ffffff55}.pitch:after{content:'';position:absolute;width:90px;height:90px;border:2px solid #ffffff55;border-radius:50%;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none}.line{display:flex;justify-content:space-around;gap:5px;position:relative;z-index:1}.spot{width:24%;max-width:135px;text-align:center}.spot b{display:block;background:#c3ff45;color:#10251b;border-radius:20px;width:37px;height:37px;line-height:37px;margin:0 auto 6px;font-size:11px;box-shadow:0 3px 8px #0006}.spot select{font-size:11px;padding:7px 3px;min-height:33px;background:#071b1bd9;border-color:#d9f3e266;color:white;text-align:center}.item{border-bottom:1px solid #314455;padding:10px 0}footer{padding:20px;text-align:center;color:#869cb1;font-size:12px}a{color:#c3ff45}@media(min-width:700px){main{padding:25px}.panel{padding:24px}header{padding-left:max(25px,calc((100vw - 900px)/2))}form{grid-template-columns:repeat(2,minmax(0,1fr))}form button{grid-column:1/-1}}
</style></head><body><header><h1>FC 27 <span style="color:#c3ff45">Manager</span></h1><p>◆ Napoli Edition &nbsp; / &nbsp; Career Hub</p></header><nav id="tabs"></nav><main id="app"></main><footer>Dati salvati solo su questo browser · Esegui backup periodici</footer><script>
const KEY='fc27-napoli-v1';const sample=['Højlund|ATT','De Bruyne|CC','McTominay|CC','Lobotka|CDC','Nusa|AS','Vergara|COC','Rrahmani|DC','Politano|AD','Lucca|ATT','Lang|AS','Santos|CC'].map((x,i)=>({id:'p'+i,name:x.split('|')[0],role:x.split('|')[1],overall:'',contract:'',status:'Disponibile',goals:0,assists:0,appearances:0,origin:'Esempio'}));const blank=()=>({players:sample,market:[],youth:[],matches:[],formation:Array(11).fill(''),formationName:'4-3-3',note:''});let data;try{data=JSON.parse(localStorage.getItem(KEY))||blank()}catch{data=blank()}let tab='Rosa';const tabs=['Rosa','Formazione','Mercato','Vivaio','Calendario','Backup'];const save=()=>localStorage.setItem(KEY,JSON.stringify(data));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);const fields=(names)=>names.map(([k,l,t='text',opts])=>`<label>${l}${opts?`<select name="${k}">${opts.map(v=>`<option>${esc(v)}</option>`).join('')}</select>`:`<input name="${k}" type="${t}" ${t==='number'?'min="0"':''}>`}</label>`).join('');function render(){document.getElementById('tabs').innerHTML=tabs.map(t=>`<button class="${t===tab?'active':''}" onclick="go('${t}')">${t}</button>`).join('');let html='';if(tab==='Rosa'){html=`<section class="panel"><h2>La mia rosa (${data.players.length})</h2><p class="notice">I giocatori iniziali sono esempi, non dati confermati della tua carriera. Modificali liberamente.</p><form onsubmit="addPlayer(event)">${fields([['name','Nome'],['role','Ruolo','text'],['overall','Overall','number'],['contract','Scadenza contratto (anno)','number']])}<button class="primary">+ Aggiungi giocatore</button></form></section>`+data.players.map(p=>`<section class="panel"><div class="row"><strong>${esc(p.name)}</strong><span class="tag ${p.origin==='Esempio'?'demo':''}">${esc(p.origin)}</span></div><div class="muted">${esc(p.role)} · OVR ${esc(p.overall||'—')} · Contratto ${esc(p.contract||'—')}</div><div class="muted">${esc(p.status)} · ${p.appearances||0} presenze · ${p.goals||0} gol · ${p.assists||0} assist</div><div class="row" style="margin-top:9px"><button class="secondary" onclick="editPlayer('${p.id}')">Modifica</button><button class="secondary danger" onclick="removeItem('players','${p.id}')">Elimina</button></div></section>`).join('')}else if(tab==='Formazione'){let labels=[['AS','ATT','AD'],['CC','CDC','CC'],['TS','DC','DC','TD'],['POR']];let index=0;html=`<section class="panel"><h2>Formazione titolare</h2><label>Modulo</label><select onchange="data.formationName=this.value;save()">${['4-3-3','4-2-3-1','4-4-2','3-5-2'].map(x=>`<option ${data.formationName===x?'selected':''}>${x}</option>`).join('')}</select><p class="notice">Prima versione: seleziona i calciatori per ogni posizione. La disposizione grafica è 4-3-3; gli altri moduli saranno aggiunti dopo.</p><div class="pitch">${labels.map(line=>`<div class="line">${line.map(role=>{let n=index++;return `<div class="spot"><b>${role}</b><select onchange="data.formation[${n}]=this.value;save()"><option value="">Scegli</option>${data.players.map(p=>`<option value="${esc(p.id)}" ${data.formation[n]===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div>`}).join('')}</div>`).join('')}</div></section><section class="panel"><h2>Riserve e alternative</h2>${data.players.filter(p=>!data.formation.includes(p.id)).map(p=>`<div class="item">${esc(p.name)} · ${esc(p.role)}</div>`).join('')||'Nessuna riserva disponibile'}</section>`}else if(tab==='Mercato'){html=`<section class="panel"><h2>Calciomercato</h2><form onsubmit="addSimple(event,'market')">${fields([['name','Giocatore'],['type','Operazione','text',['Obiettivo','Trattativa','Acquistato','Venduto','Prestito in entrata','Prestito in uscita']],['price','Importo (€)','number'],['notes','Note']])}<button class="primary">+ Registra operazione</button></form></section>`+data.market.map(x=>simpleCard(x,'market',`${x.type} · €${x.price||'—'} · ${x.notes||''}`)).join('')}else if(tab==='Vivaio'){html=`<section class="panel"><h2>Settore giovanile</h2><p class="notice">Puoi registrare anche le missioni di scouting. Il paese attuale non è ancora confermato.</p><form onsubmit="addSimple(event,'youth')">${fields([['name','Giocatore oppure missione'],['country','Paese'],['role','Ruolo / tipo ricerca'],['potential','Potenziale'],['notes','Note']])}<button class="primary">+ Aggiungi</button></form></section>`+data.youth.map(x=>simpleCard(x,'youth',`${x.country||'Paese da verificare'} · ${x.role||''} · Potenziale ${x.potential||'—'} · ${x.notes||''}`)).join('')}else if(tab==='Calendario'){html=`<section class="panel"><h2>Calendario e risultati</h2><form onsubmit="addSimple(event,'matches')">${fields([['date','Data','date'],['opponent','Avversario'],['competition','Competizione','text',['Serie A','Champions League','Coppa Italia','Amichevole']],['for','Gol Napoli','number'],['against','Gol avversario','number'],['scorers','Marcatori / note']])}<button class="primary">+ Registra partita</button></form></section>`+data.matches.slice().reverse().map(x=>simpleCard(x,'matches',`${x.date||''} · ${x.competition} · Napoli ${x.for||0}–${x.against||0} ${x.opponent} · ${x.scorers||''}`,x.opponent)).join('')}else{html=`<section class="panel"><h2>Backup dei tuoi dati</h2><p>Esporta periodicamente una copia. Se Safari cancella i dati del sito, il salvataggio locale potrebbe andare perso.</p><button class="primary" onclick="backup()">Scarica backup JSON</button><h3>Ripristina backup</h3><input type="file" accept="application/json,.json" onchange="restore(event)"><p class="notice">Il ripristino sostituisce tutti i dati attuali.</p></section><section class="panel"><h2>Attenzione alla privacy</h2><p>GitHub Pages pubblica il codice dell'app. Non inserire password o dati sensibili nel codice. I dati della carriera rimangono nel browser, salvo backup esportati da te.</p></section>`}document.getElementById('app').innerHTML=html}function go(t){tab=t;render();window.scrollTo(0,0)}function addPlayer(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));if(!f.name.trim())return;data.players.push({id:uid(),...f,status:'Disponibile',goals:0,assists:0,appearances:0,origin:'Inserito da me'});save();render()}function editPlayer(id){let p=data.players.find(x=>x.id===id);if(!p)return;for(let [k,label] of [['name','Nome'],['role','Ruolo'],['overall','Overall'],['contract','Scadenza contratto'],['status','Stato (Disponibile/Infortunato/Squalificato/Recupero)'],['appearances','Presenze'],['goals','Gol'],['assists','Assist']]){let v=prompt(label,p[k]??'');if(v===null)break;p[k]=v;p.origin='Modificato da me'}save();render()}function removeItem(key,id){if(!confirm('Eliminare questa voce?'))return;data[key]=data[key].filter(x=>x.id!==id);save();render()}function addSimple(e,key){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));data[key].push({id:uid(),...f});save();render()}function simpleCard(x,key,detail,title){return `<section class="panel"><strong>${esc(title||x.name)}</strong><div class="muted">${esc(detail)}</div><button class="secondary danger" style="margin-top:8px" onclick="removeItem('${key}','${x.id}')">Elimina</button></section>`}function backup(){let b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='fc27-napoli-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function restore(e){let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(!Array.isArray(d.players)||!Array.isArray(d.market)||!Array.isArray(d.youth)||!Array.isArray(d.matches)||!Array.isArray(d.formation))throw Error('Formato non valido');if(confirm('Sostituire tutti i dati attuali con questo backup?')){data=d;save();render()}}catch(err){alert('Impossibile leggere il backup: '+err.message)}}render();</script></body></html>
